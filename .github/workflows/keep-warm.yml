# Ping backend trên Render định kỳ để instance free không bị ngủ (sleep sau 15 phút không có request).
name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *" # mỗi 10 phút (giờ UTC)
  workflow_dispatch: # cho phép bấm chạy tay trên tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://txnn-be.onrender.com || echo "000")
          echo "HTTP status: $code"
