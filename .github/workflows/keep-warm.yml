# Ping các backend trên Render định kỳ để instance free không bị ngủ (sleep sau 15 phút không có request).
name: Keep Render warm

on:
  schedule:
    - cron: "*/10 * * * *" # mỗi 10 phút (giờ UTC)
  workflow_dispatch: # cho phép bấm chạy tay trên tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://txnn-be.onrender.com
          - https://food-be-4r22.onrender.com
    steps:
      - name: Ping ${{ matrix.url }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "${{ matrix.url }}" || echo "000")
          echo "HTTP status: $code"
